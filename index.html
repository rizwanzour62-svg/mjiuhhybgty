<!DOCTYPE html>
<html lang="en">
<head>
  <meta property="og:title" content="❤️💚🧡">
  <meta property="og:description" content="Video Gallery">
  <meta property="og:image" content="https://tinyurl.com/bddrhzmh">
  <meta property="og:type" content="website">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Gallery</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0f0f0f;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
    .gallery-container{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:25px;width:100%;max-width:1100px}
    .video-card{position:relative;display:block;border-radius:12px;overflow:hidden;aspect-ratio:16/9;box-shadow:0 8px 24px rgba(0,0,0,.5);background:#222;cursor:pointer}
    .video-thumbnail{width:100%;height:100%;object-fit:cover;transition:.4s}
    .play-overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.2)}
    .play-button{width:65px;height:65px;background:rgba(255,255,255,.9);border-radius:50%;display:flex;justify-content:center;align-items:center;transition:.3s}
    .play-icon{width:0;height:0;border-top:12px solid transparent;border-bottom:12px solid transparent;border-left:20px solid #111;margin-left:5px}
    .video-card:hover .video-thumbnail{transform:scale(1.05);filter:brightness(.85)}
    .video-card:hover .play-button{transform:scale(1.15);background:#f00}
    .video-card:hover .play-icon{border-left-color:#fff}
  </style>
</head>
<body>
  <div class="gallery-container">
    <a href="https://auctionr.org/4/dfea37504c65630d07a58ba8b5aae931" class="video-card">
      <img src="https://tinyurl.com/4vws3927" alt="Video 1">
      <div class="play-overlay"><div class="play-button"><div class="play-icon"></div></div></div>
    </a>
    <a href="https://auctionr.org/4/dfea37504c65630d07a58ba8b5aae931" class="video-card">
      <img src="https://tinyurl.com/3xeehby9" alt="Video 2">
      <div class="play-overlay"><div class="play-button"><div class="play-icon"></div></div></div>
    </a>
    <a href="https://auctionr.org/4/dfea37504c65630d07a58ba8b5aae931" class="video-card">
      <img src="https://tinyurl.com/y2ypae3s" alt="Video 3">
      <div class="play-overlay"><div class="play-button"><div class="play-icon"></div></div></div>
    </a>
  </div>
</body>
</html>
